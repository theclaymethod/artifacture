<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radix WebGPU • High-Res SH3 & CUDA MPM 3DGS FX</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #eef4fb;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #fx-hud {
      position: fixed;
      left: 24px;
      top: 22px;
      z-index: 10;
      pointer-events: none;
      max-width: 470px;
    }
    #fx-kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6ee7ff;
      margin-bottom: 6px;
    }
    #fx-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 6px;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }
    #fx-sub {
      font-size: 12.5px;
      line-height: 1.45;
      color: rgba(226, 236, 248, 0.82);
      margin: 0;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9);
    }
    #fx-scenes {
      position: fixed;
      right: 24px;
      top: 22px;
      z-index: 10;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 700px;
    }
    #fx-modes {
      position: fixed;
      left: 24px;
      bottom: 22px;
      right: 260px;
      z-index: 10;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .fx-btn, .scene-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 12, 18, 0.72);
      backdrop-filter: blur(10px);
      color: #d6e2ef;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }
    .fx-btn.active {
      background: rgba(110, 231, 255, 0.2);
      border-color: #6ee7ff;
      color: #ffffff;
    }
    .scene-btn.active {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
      color: #ffffff;
    }
    .scene-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    #fx-status {
      position: fixed;
      right: 24px;
      bottom: 22px;
      z-index: 10;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: rgba(220, 232, 245, 0.8);
      background: rgba(10, 12, 18, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 10px;
      pointer-events: none;
    }
    body.cinema #fx-hud,
    body.cinema #fx-scenes,
    body.cinema #fx-modes,
    body.cinema #fx-status {
      display: none !important;
    }
    #cinema-vignette {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.44) 0%, rgba(0, 0, 0, 0) 18%),
        linear-gradient(to top, rgba(0, 0, 0, 0.84) 0%, rgba(0, 0, 0, 0.42) 19%, rgba(0, 0, 0, 0) 42%);
    }
    body.cinema #cinema-vignette {
      display: block;
    }
    #cinema-caption {
      display: none;
      position: fixed;
      left: 7%;
      right: 19%;
      bottom: 13.5%;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
    }
    body.cinema #cinema-caption {
      display: block;
    }
    #cinema-kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7ae9ff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      margin-bottom: 5px;
    }
    #cinema-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.08;
      color: #ffffff;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.92);
    }
    #cinema-sub {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: rgba(232, 240, 250, 0.84);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.92);
      margin-top: 5px;
    }
    #cinema-titlecard {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 10%;
      background: radial-gradient(circle at center, rgba(5, 8, 14, 0.64) 0%, rgba(0, 0, 0, 0.9) 75%);
      opacity: 0;
    }
    body.cinema #cinema-titlecard {
      display: flex;
      flex-direction: column;
    }
    #card-kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #7ae9ff;
      margin-bottom: 10px;
    }
    #card-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.06;
      color: #ffffff;
    }
    #card-sub {
      font-size: 13px;
      color: rgba(226, 236, 248, 0.78);
      margin-top: 10px;
      line-height: 1.45;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.webgpu.js",
        "three/webgpu": "/vendor/three/build/three.webgpu.js",
        "three/tsl": "/vendor/three/build/three.tsl.js",
        "three/addons/": "/vendor/three/examples/jsm/",
        "three/examples/jsm/": "/vendor/three/examples/jsm/",
        "@sparkjsdev/radix": "/vendor/radix/radix.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="fx-hud">
    <div id="fx-kicker">@SPARKJSDEV/RADIX · WEBGPU TSL + CUDA MPM</div>
    <h1 id="fx-title">1 · Monochrome LiDAR Shockwave</h1>
    <p id="fx-sub">Loading photorealistic 3D Gaussian Splat scene...</p>
  </div>
  <div id="fx-scenes">
    <button class="scene-btn" data-scene="forest_clearing">Forest Clearing (Dynamic Singularity)</button>
    <button class="scene-btn" data-scene="singularity_clearing">Singularity Clearing (1.18M)</button>
    <button class="scene-btn active" data-scene="stump">Forest Stump (1.2M SH3)</button>
    <button class="scene-btn" data-scene="buddha">Stone Buddha</button>
    <button class="scene-btn" data-scene="jade_king_mpm">Jade King (CUDA MPM)</button>
    <button class="scene-btn" data-scene="tokyo_alley">Tokyo Neon Alley</button>
    <button class="scene-btn" data-scene="train">Steam Train (SH3)</button>
    <button class="scene-btn" data-scene="bonsai_mpm">Bonsai (CUDA Warp MPM)</button>
    <button class="scene-btn" data-scene="ceramic">Ceramic Cave</button>
    <button class="scene-btn" data-scene="cozy">Cozy Cottage</button>
    <button class="scene-btn" data-scene="playroom">Playroom (SH3)</button>
    <button class="scene-btn" data-scene="drjohnson">Victorian Hall (SH3)</button>
    <button class="scene-btn" data-scene="grace">Grace Cathedral (10M SH3)</button>
    <button class="scene-btn" data-scene="sutro">Sutro Tower (2M SH3)</button>
    <button class="scene-btn" data-scene="garden">Garden (5.8M SH3)</button>
    <button class="scene-btn" data-scene="bicycle">Bicycle (SH3)</button>
    <button class="scene-btn" data-scene="greyscale">Greyscale Room</button>
    <button class="scene-btn" data-scene="snow">Snow Street</button>
  </div>
  <div id="fx-modes">
    <button class="fx-btn active" data-mode="shockwave">1 · LiDAR Shockwave</button>
    <button class="fx-btn" data-mode="dissolve">2 · Volumetric Smoke</button>
    <button class="fx-btn" data-mode="neon">3 · HDR Neon</button>
    <button class="fx-btn" data-mode="geowave">4 · Geo Shatter</button>
    <button class="fx-btn" data-mode="vortex">5 · Vortex Tornado</button>
    <button class="fx-btn" data-mode="mpm">6 · CUDA MPM Shatter</button>
    <button class="fx-btn" data-mode="voxel">7 · 3D Voxel</button>
    <button class="fx-btn" data-mode="singularity">8 · Singularity</button>
    <button class="fx-btn" data-mode="tokyo">9 · Tokyo Neon</button>
  </div>
  <div id="fx-status">Initializing WebGPU...</div>

  <div id="cinema-vignette"></div>
  <div id="cinema-caption">
    <div id="cinema-kicker"></div>
    <div id="cinema-title"></div>
    <div id="cinema-sub"></div>
  </div>
  <div id="cinema-titlecard">
    <div id="card-kicker"></div>
    <div id="card-title"></div>
    <div id="card-sub"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
