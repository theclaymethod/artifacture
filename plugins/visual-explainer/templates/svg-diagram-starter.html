<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event processing pipeline</title>
<!-- Replace the example, title, and description together. Keep text at least 16px at
     the initial viewing scale. Prefix SVG IDs when embedding multiple diagrams. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #F0EFEB;
    --surface: #F8F7F3;
    --ink: #1C1C1A;
    --muted: #62615C;
    --rule: #AAA9A2;
    --accent: #1C1C1A;
    --accent-tint: #E6E5DE;
    --font-body: "Inter", system-ui, sans-serif;
    --font-display: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1C1C1A;
      --surface: #252522;
      --ink: #F0EFEB;
      --muted: #BCBBB3;
      --rule: #8F8E88;
      --accent: #F0EFEB;
      --accent-tint: #33332F;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(24px, 6vw, 72px); background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
  main { max-width: 1120px; margin: auto; }
  h1 { margin: 0; font: 400 clamp(36px, 5vw, 60px)/1.08 var(--font-display); text-wrap: balance; }
  p { max-width: 68ch; color: var(--muted); }
  .diagram-frame { margin: 40px 0 0; overflow-x: auto; padding: 12px 0; scrollbar-color: var(--rule) transparent; }
  .diagram { display: block; width: 100%; min-width: 880px; height: auto; }
  .diagram-node { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
  .diagram-node--focal { fill: var(--accent-tint); stroke: var(--accent); }
  .connector { fill: none; stroke: var(--muted); stroke-width: 1.75; }
  .connector--focal { stroke: var(--accent); }
  .node-name { fill: var(--ink); font: 500 20px var(--font-body); }
  .node-detail, .edge-label { fill: var(--muted); font: 400 17px var(--font-body); }
  ::selection { color: var(--paper); background: var(--ink); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
</style>
</head>
<body>
<main>
  <h1>Validate events before storage</h1>
  <p>Store valid events in the warehouse. Retain rejected events in the dead-letter queue for inspection and replay.</p>
  <figure class="diagram-frame" tabindex="0" aria-label="Pipeline diagram; scroll horizontally on small screens">
    <svg
      id="ve-reference-architecture" data-diagram-role="diagram" class="diagram" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ve-reference-architecture-title ve-reference-architecture-desc">
      <title id="ve-reference-architecture-title">Event processing pipeline</title>
      <desc id="ve-reference-architecture-desc">An event stream sends a batch to a validator. Valid events continue to the warehouse. Rejected events follow a separate branch into a dead-letter queue, where they can be inspected and replayed.</desc>
      <defs>
        <marker id="ve-reference-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/></marker>
        <marker id="ve-reference-architecture-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker>
      </defs>
      <!-- Edges precede nodes. Labels occupy their own space above each path. -->
      <path class="connector" data-diagram-role="arrow" data-diagram-source="ve-reference-architecture-stream" data-diagram-source-anchor="right-center" data-diagram-target="ve-reference-architecture-validator" data-diagram-target-anchor="left-center" d="M 278 130 H 412" marker-end="url(#ve-reference-architecture-arrow)"/>
      <path class="connector connector--focal" data-diagram-role="arrow" data-diagram-source="ve-reference-architecture-validator" data-diagram-source-anchor="right-center" data-diagram-target="ve-reference-architecture-warehouse" data-diagram-target-anchor="left-center" d="M 688 130 H 822" marker-end="url(#ve-reference-architecture-arrow-accent)"/>
      <path class="connector" data-diagram-role="arrow" data-diagram-source="ve-reference-architecture-validator" data-diagram-source-anchor="bottom-center" data-diagram-target="ve-reference-architecture-rejected" data-diagram-target-anchor="top-center" d="M 550 190 V 288" stroke-dasharray="6 5" marker-end="url(#ve-reference-architecture-arrow)"/>
      <text class="edge-label" x="345" y="108" text-anchor="middle">Batch</text>
      <text class="edge-label" x="755" y="108" text-anchor="middle">Valid events</text>
      <text class="edge-label" x="574" y="246">Rejected events</text>
      <g>
        <rect data-diagram-role="node" data-diagram-id="ve-reference-architecture-stream" class="diagram-node" x="20" y="78" width="250" height="104" rx="12"/>
        <text class="node-name" x="145" y="122" text-anchor="middle">Event stream</text>
        <text class="node-detail" x="145" y="150" text-anchor="middle">Incoming messages</text>
      </g>
      <g>
        <rect data-diagram-role="node" data-diagram-id="ve-reference-architecture-validator" class="diagram-node" x="420" y="78" width="260" height="104" rx="12"/>
        <text class="node-name" x="550" y="122" text-anchor="middle">Validate and map</text>
        <text class="node-detail" x="550" y="150" text-anchor="middle">Check the event schema</text>
      </g>
      <g>
        <rect data-diagram-role="node" data-diagram-id="ve-reference-architecture-warehouse" class="diagram-node diagram-node--focal" x="830" y="78" width="250" height="104" rx="12"/>
        <text class="node-name" x="955" y="122" text-anchor="middle">Warehouse</text>
        <text class="node-detail" x="955" y="150" text-anchor="middle">Store accepted events</text>
      </g>
      <g>
        <rect data-diagram-role="node" data-diagram-id="ve-reference-architecture-rejected" class="diagram-node" x="420" y="296" width="260" height="104" rx="12"/>
        <text class="node-name" x="550" y="340" text-anchor="middle">Dead-letter queue</text>
        <text class="node-detail" x="550" y="368" text-anchor="middle">Inspect and replay</text>
      </g>
    </svg>
  </figure>
</main>
</body>
</html>
